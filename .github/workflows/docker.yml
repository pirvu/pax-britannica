name: docker

on:
  push:
    branches: [wasm-port]
  pull_request:
    branches: [wasm-port]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The submodules are branches of this same repository, so their
          # commits are not reachable from wasm-port. A shallow single-branch
          # checkout would leave them missing and the init below would fail.
          fetch-depth: 0

      # Not actions/checkout's `submodules:` option: .gitmodules points at "."
      # and cloning a submodule over the file transport has been disabled by
      # default since git 2.38 (CVE-2022-39253), which the action cannot be
      # told to override.
      - name: Initialise engine submodules
        run: git -c protocol.file.allow=always submodule update --init

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        # Skipped for pull requests from forks, which get no package write.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/wasm-port' }}

      - uses: docker/build-push-action@v6
        with:
          # The build needs the game's Lua, sprites and audio from the
          # repository root, so the context is the root and not web/.
          context: .
          file: web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name pax -p 8080:80 "${IMAGE}:sha-$(git rev-parse --short HEAD)"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/index.html >/dev/null && break
            sleep 1
          done
          echo "--- index.html ---"
          curl -fsS -o /dev/null -w '%{http_code} %{content_type}\n' http://localhost:8080/index.html
          echo "--- index.wasm ---"
          curl -fsS -o /dev/null -w '%{http_code} %{content_type} %{size_download} bytes\n' http://localhost:8080/index.wasm
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/index.data
          # A wrong MIME type here means the browser cannot stream-compile.
          curl -fsSI http://localhost:8080/index.wasm | grep -qi 'content-type: application/wasm'
          docker rm -f pax
