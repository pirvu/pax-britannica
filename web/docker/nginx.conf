server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # nginx has mapped .wasm to application/wasm since 1.21.1, and the image is
    # pinned well past that. This is here so an older base image downgrades to
    # a slow startup rather than a broken one: without the right type the
    # browser refuses the streaming compile and falls back to ArrayBuffer.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # index.data is 6.5MB of sprites and music, and index.wasm over 1MB. Both
    # compress well and neither is served by any other route.
    gzip              on;
    gzip_types        application/wasm application/javascript text/html text/css application/octet-stream;
    gzip_min_length   1024;
    # Without this nothing is ever compressed in the deployment that matters:
    # gzip_proxied defaults to off, a request counts as proxied when it carries
    # a Via header, and the Caddy edge in front of this adds one. Direct hits
    # compressed fine, which is what made it easy to miss.
    gzip_proxied      any;
    gzip_vary         on;

    # Every asset name changes only when the build does, but index.html must
    # not be cached or a redeploy leaves viewers on the old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
